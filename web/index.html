<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prácticas Continuas · Apuntes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♾️</text></svg>">
<link rel="stylesheet" href="styles.css">
<script>
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
</script>
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Mostrar/ocultar menú" aria-expanded="false">☰</button>

  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <button type="button" id="home-link" class="sidebar-title">Prácticas Continuas</button>

      <section class="nav-section">
        <h2>Teoría</h2>
        <ul id="nav-temas" class="nav-list"></ul>
      </section>

      <section class="nav-section">
        <h2>Prácticas</h2>
        <ul id="nav-practicas" class="nav-list"></ul>
      </section>
    </nav>

    <main class="viewer-pane">
      <header class="viewer-header">
        <span id="viewer-title" class="viewer-title">Inicio</span>
        <div class="viewer-actions">
          <button id="theme-btn" class="toolbar-btn theme-btn" type="button" aria-pressed="false" title="Cambiar entre modo claro y oscuro">
            <svg class="btn-icon icon-moon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
            <svg class="btn-icon icon-sun" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
            <span class="theme-label">Modo oscuro</span>
          </button>
          <button id="present-btn" class="toolbar-btn" hidden>Presentar <svg class="btn-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
          <a id="md-btn" class="toolbar-btn" hidden download>Descargar MD <svg class="btn-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13.5h10"/></svg></a>
        </div>
      </header>
      <div id="home-view" class="home-view">
        <section class="home-section">
          <h2>Teoría</h2>
          <div id="home-temas" class="home-grid"></div>
        </section>
        <section class="home-section">
          <h2>Prácticas</h2>
          <div id="home-practicas" class="home-grid"></div>
        </section>
      </div>
      <iframe id="viewer" class="viewer-frame" hidden title="Contenido"></iframe>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
